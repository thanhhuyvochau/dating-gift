<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Date</title>
    <link rel="stylesheet" href="css/date.css" />
  </head>
  <body>
    <h1 title="choose a date">Em rảnh ngày...</h1>
    <form id="date-form" class="form-group">
      <label for="datetime">Ngày: (chọn 1 ngày thôi nha)</label>
      <div>
        <input id="datetime" type="datetime-local" />
        <button class="button" type="button" onclick="onSubmit()">
          Nộp cho anh Huy
        </button>
      </div>
    </form>
    <script>
      function onSubmit() {
        // Get the input element
        let dateInputEl = document.getElementById("datetime");

        // Check if a date is selected
        if (dateInputEl.value) {
          console.log("Ngày đã chọn:", dateInputEl.value);
        } else {
          alert("Chọn ngày đi rồi hãy nộp nghe chưaa!");
        }
      }
    </script>
  </body>
</html>
